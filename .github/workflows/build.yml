name: CoBrowser Windows Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release for this run"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cobrowser-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows x64 and ARM64
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve release version from tag
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace "^v", ""
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            $version = node -p "require('./installer/electron/package.json').version"
          }
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) { throw "Could not resolve CoBrowser version." }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Building CoBrowser version $version"

      - name: Validate Google OAuth secrets
        shell: pwsh
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_OAUTH_CLIENT_ID)) { throw "Missing GitHub Secret: GOOGLE_OAUTH_CLIENT_ID" }
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_OAUTH_CLIENT_SECRET)) { throw "Missing GitHub Secret: GOOGLE_OAUTH_CLIENT_SECRET" }
          if (-not $env:GOOGLE_OAUTH_CLIENT_ID.EndsWith('.apps.googleusercontent.com')) { throw "Invalid Google OAuth Client ID. Use a Desktop app client." }

      - name: Restore solution
        run: dotnet restore .\CoBrowser.sln

      - name: Build x64 browser, Setup EXE and Portable ZIP
        shell: pwsh
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          $ErrorActionPreference = "Stop"
          $runtime = "artifacts/windows-x64"
          dotnet publish .\windows\CoBrowser\CoBrowser.csproj -c Release -r win-x64 --self-contained true -p:PlatformTarget=x64 -p:PublishSingleFile=false -p:GoogleOAuthClientId="$env:GOOGLE_OAUTH_CLIENT_ID" -o $runtime
          if ($LASTEXITCODE -ne 0) { throw "x64 dotnet publish failed." }
          $oauth = @{ installed = @{ client_id = $env:GOOGLE_OAUTH_CLIENT_ID; client_secret = $env:GOOGLE_OAUTH_CLIENT_SECRET } } | ConvertTo-Json -Depth 4 -Compress
          Set-Content -LiteralPath (Join-Path $runtime "google-oauth.json") -Value $oauth -Encoding utf8
          node .\installer\electron\build.cjs --payload $runtime --arch x64 --version ${{ steps.version.outputs.version }}
          if ($LASTEXITCODE -ne 0) { throw "x64 Setup EXE build failed." }
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $setup = ".\installer\electron\dist\CoBrowser-Setup-${{ steps.version.outputs.version }}-x64.exe"
          if (-not (Test-Path $setup)) { throw "x64 Setup EXE missing: $setup" }
          Copy-Item $setup "release-assets/CoBrowser-Setup-${{ steps.version.outputs.version }}-x64.exe" -Force
          $portable = "release-assets/CoBrowser-${{ steps.version.outputs.version }}-Windows-x64-portable.zip"
          Compress-Archive -Path "$runtime/*" -DestinationPath $portable -CompressionLevel Optimal -Force
          $verify = Join-Path $env:RUNNER_TEMP "verify-x64"
          Expand-Archive $portable $verify -Force
          if (-not (Test-Path (Join-Path $verify "CoBrowser.exe"))) { throw "x64 portable ZIP validation failed." }
          if (-not (Test-Path (Join-Path $verify "google-oauth.json"))) { throw "x64 OAuth config missing from portable ZIP." }

      - name: Build ARM64 browser, Setup EXE and Portable ZIP
        shell: pwsh
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          $ErrorActionPreference = "Stop"
          $runtime = "artifacts/windows-arm64"
          dotnet publish .\windows\CoBrowser\CoBrowser.csproj -c Release -r win-arm64 --self-contained true -p:PlatformTarget=ARM64 -p:PublishSingleFile=false -p:GoogleOAuthClientId="$env:GOOGLE_OAUTH_CLIENT_ID" -o $runtime
          if ($LASTEXITCODE -ne 0) { throw "ARM64 dotnet publish failed. Check that all native dependencies, especially CefSharp, provide win-arm64 assets." }
          $oauth = @{ installed = @{ client_id = $env:GOOGLE_OAUTH_CLIENT_ID; client_secret = $env:GOOGLE_OAUTH_CLIENT_SECRET } } | ConvertTo-Json -Depth 4 -Compress
          Set-Content -LiteralPath (Join-Path $runtime "google-oauth.json") -Value $oauth -Encoding utf8
          node .\installer\electron\build.cjs --payload $runtime --arch arm64 --version ${{ steps.version.outputs.version }}
          if ($LASTEXITCODE -ne 0) { throw "ARM64 Setup EXE build failed." }
          $setup = ".\installer\electron\dist\CoBrowser-Setup-${{ steps.version.outputs.version }}-arm64.exe"
          if (-not (Test-Path $setup)) { throw "ARM64 Setup EXE missing: $setup" }
          Copy-Item $setup "release-assets/CoBrowser-Setup-${{ steps.version.outputs.version }}-arm64.exe" -Force
          $portable = "release-assets/CoBrowser-${{ steps.version.outputs.version }}-Windows-arm64-portable.zip"
          Compress-Archive -Path "$runtime/*" -DestinationPath $portable -CompressionLevel Optimal -Force
          $verify = Join-Path $env:RUNNER_TEMP "verify-arm64"
          Expand-Archive $portable $verify -Force
          if (-not (Test-Path (Join-Path $verify "CoBrowser.exe"))) { throw "ARM64 portable ZIP validation failed." }
          if (-not (Test-Path (Join-Path $verify "google-oauth.json"))) { throw "ARM64 OAuth config missing from portable ZIP." }

      - name: Verify all release assets
        shell: pwsh
        run: |
          $expected = @(
            "CoBrowser-Setup-${{ steps.version.outputs.version }}-x64.exe",
            "CoBrowser-${{ steps.version.outputs.version }}-Windows-x64-portable.zip",
            "CoBrowser-Setup-${{ steps.version.outputs.version }}-arm64.exe",
            "CoBrowser-${{ steps.version.outputs.version }}-Windows-arm64-portable.zip"
          )
          foreach ($name in $expected) {
            $path = Join-Path "release-assets" $name
            if (-not (Test-Path $path)) { throw "Release asset missing: $path" }
            if ((Get-Item $path).Length -le 0) { throw "Release asset is empty: $path" }
          }
          Get-ChildItem release-assets | Select-Object Name, Length

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: CoBrowser-Windows-Release
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: CoBrowser-Windows-Release
          path: release-assets

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/CoBrowser-Setup-${{ needs.build.outputs.version }}-x64.exe
          test -s release-assets/CoBrowser-${{ needs.build.outputs.version }}-Windows-x64-portable.zip
          test -s release-assets/CoBrowser-Setup-${{ needs.build.outputs.version }}-arm64.exe
          test -s release-assets/CoBrowser-${{ needs.build.outputs.version }}-Windows-arm64-portable.zip
          ls -lh release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: CoBrowser ${{ needs.build.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/CoBrowser-Setup-${{ needs.build.outputs.version }}-x64.exe
            release-assets/CoBrowser-${{ needs.build.outputs.version }}-Windows-x64-portable.zip
            release-assets/CoBrowser-Setup-${{ needs.build.outputs.version }}-arm64.exe
            release-assets/CoBrowser-${{ needs.build.outputs.version }}-Windows-arm64-portable.zip
